server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # El ruteo de la app es por hash (#DASHBOARD, #PURCHASE_ORDERS, ...) — la
    # parte después del "#" nunca llega al servidor, así que no hace falta
    # una regla de rewrite para rutas del cliente. Este fallback es solo
    # defensivo (por si alguien pide una ruta que no existe).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos de dist/assets/ ya llevan un hash en el nombre
    # (ej. index-CyFKYqKP.js) — son inmutables: un contenido nuevo siempre
    # genera un nombre de archivo nuevo, así que cachearlos "para siempre" es
    # seguro y evita que el navegador los vuelva a pedir en cada visita.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html sí cambia entre despliegues (referencia los assets nuevos) y
    # debe revalidarse siempre, o el navegador podría quedarse sirviendo una
    # versión vieja que apunta a JS que ya no existe.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
