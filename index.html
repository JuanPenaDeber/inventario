<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventario El Deber 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      /* Custom scrollbar for table */
      .custom-scrollbar::-webkit-scrollbar {
        height: 8px;
        width: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }

      /* Screen specific styles - ONLY apply when looking at screen */
      @media screen {
        .hidden-on-screen {
          display: none !important;
        }
      }

      @media print {
        @page { margin: 0; size: auto; }
        body { 
            background: white;
            margin: 0;
            padding: 0;
        }
        
        /* Hide everything by default */
        body * {
            visibility: hidden;
        }

        /* Specific helper to hide elements in print explicitly */
        .no-print, .no-print * { 
            display: none !important; 
        }

        /* Show the print area and its children */
        .print-area, .print-area * {
            visibility: visible;
        }

        .print-area {
            display: block !important;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            min-height: 100vh;
            z-index: 9999;
            background: white;
            padding: 2cm; /* Default print padding */
            color: black;
        }
        
        /* Ensure lists and tables display correctly */
        .print-area table { width: 100%; border-collapse: collapse; }
        .print-area th, .print-area td { border: 1px solid black; padding: 8px; }
        
        /* Hide scrollbars in print */
        ::-webkit-scrollbar { display: none; }
      }
    </style>
</head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
